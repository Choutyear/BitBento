[package]
name = "bitbento"
version = "0.1.0"
description = "BitBento local video compressor"
authors = ["BitBento"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "bitbento_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "bitbento"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "sync", "time", "io-util", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
