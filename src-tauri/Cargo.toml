[package]
name = "bitbento"
version = "0.2.1"
description = "BitBento local video compressor"
authors = ["Steve Chou"]
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "bitbento"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "sync", "time", "io-util", "macros", "rt-multi-thread", "fs"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
dirs = "6"
parking_lot = "0.12"
open = "5"
windows-sys = { version = "0.59", features = ["Win32_System_Power"] }
